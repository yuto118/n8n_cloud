steps:
  # 1. Dockerfile.cloudrun-debugを使用してイメージをビルド
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build',
      '-f', 'Dockerfile.cloudrun-debug',
      '-t', 'gcr.io/$PROJECT_ID/n8n-debug:latest',
      '-t', 'gcr.io/$PROJECT_ID/n8n-debug:$BUILD_ID',
      '.'
    ]

  # 2. Container Registryにプッシュ
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/n8n-debug:latest']

  # 3. Cloud Runにデプロイ（詳細設定）
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args: [
      'run', 'deploy', 'n8n-cloud-poten',
      '--image', 'gcr.io/$PROJECT_ID/n8n-debug:latest',
      '--region', 'asia-northeast1',
      '--platform', 'managed',
      '--allow-unauthenticated',
      '--memory', '4Gi',
      '--cpu', '2',
      '--timeout', '900',  # 15分に延長
      '--max-instances', '3',
      '--min-instances', '0',
      '--port', '8080',
      '--concurrency', '80',
      '--no-cpu-throttling',  # CPU制限を無効化
      '--set-env-vars', 'NODE_ENV=production',
      '--set-env-vars', 'N8N_HOST=0.0.0.0',
      '--set-env-vars', 'N8N_PORT=8080',
      '--set-env-vars', 'PORT=8080',
      '--set-env-vars', 'GENERIC_TIMEZONE=Asia/Tokyo',
      '--set-env-vars', 'TZ=Asia/Tokyo',
      '--set-env-vars', 'N8N_BASIC_AUTH_ACTIVE=true',
      '--set-env-vars', 'N8N_BASIC_AUTH_USER=admin',
      '--set-env-vars', 'N8N_BASIC_AUTH_PASSWORD=changeme123',
      '--set-env-vars', 'N8N_LOG_LEVEL=debug',
      '--set-env-vars', 'NODE_OPTIONS=--max-old-space-size=3072'
    ]

images:
  - gcr.io/$PROJECT_ID/n8n-debug:latest

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'
  substitution_option: 'ALLOW_LOOSE' 