steps:
  # Dockerfile.cloudrunを使用してDockerイメージをビルド
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build',
      '-f', 'Dockerfile.cloudrun',
      '-t', 'gcr.io/$PROJECT_ID/n8n-cloudrun:latest',
      '-t', 'gcr.io/$PROJECT_ID/n8n-cloudrun:$BUILD_ID',
      '.'
    ]

  # Container Registryにプッシュ
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/n8n-cloudrun:latest']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/n8n-cloudrun:$BUILD_ID']

  # Cloud Runにデプロイ
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args: [
      'run', 'deploy', 'n8n-cloud-poten',
      '--image', 'gcr.io/$PROJECT_ID/n8n-cloudrun:latest',
      '--region', 'asia-northeast1',
      '--platform', 'managed',
      '--allow-unauthenticated',
      '--memory', '4Gi',
      '--cpu', '2',
      '--timeout', '600',
      '--max-instances', '5',
      '--port', '8080',
      '--set-env-vars', 'NODE_ENV=production,N8N_HOST=0.0.0.0,N8N_PORT=8080,GENERIC_TIMEZONE=Asia/Tokyo,N8N_BASIC_AUTH_ACTIVE=true,N8N_BASIC_AUTH_USER=admin,N8N_BASIC_AUTH_PASSWORD=changeme123'
    ]

# ビルドしたイメージ
images:
  - gcr.io/$PROJECT_ID/n8n-cloudrun:latest
  - gcr.io/$PROJECT_ID/n8n-cloudrun:$BUILD_ID

# ビルド設定
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8' 